name: Build PC Remote IPA
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: |
          cat > project.yml <<'YAML'
          name: PCRemote
          options:
            bundleIdPrefix: com.pcremote
            deploymentTarget:
              iOS: "17.0"
          settings:
            base:
              SWIFT_VERSION: 5.0
              INFOPLIST_FILE: iOS/Info.plist
              PRODUCT_BUNDLE_IDENTIFIER: com.pcremote.client
              CODE_SIGNING_ALLOWED: NO
              TARGETED_DEVICE_FAMILY: "1,2"
          targets:
            PCRemote:
              type: application
              platform: iOS
              sources:
                - path: iOS/PCRemote
              settings:
                base:
                  GENERATE_INFOPLIST_FILE: YES
                  INFOPLIST_FILE: iOS/Info.plist
          YAML
          xcodegen generate
      - name: Build app
        run: xcodebuild -project PCRemote.xcodeproj -scheme PCRemote -configuration Release -sdk iphoneos -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R DerivedData/Build/Products/Release-iphoneos/PCRemote.app Payload/
          zip -qr PCRemote-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: PCRemote-unsigned-IPA
          path: PCRemote-unsigned.ipa
